name: Release App
on:
  push:
    tags: "*"

env:
  IMAGE_NAME: ghcr.io/myjettools/settings-service
  UI_DIR: my-settings-ui
  SERVER_DIR: settings-service
  APP_NAME: my-settings-ui

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/myjettools/dioxus-docker:0.7.7
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update versions
        run: |
          sed -i -e 's/^version = .*/version = "${{ steps.get_version.outputs.VERSION }}"/' ${SERVER_DIR}/Cargo.toml
          sed -i -e 's/^version = .*/version = "${{ steps.get_version.outputs.VERSION }}"/' ${UI_DIR}/Cargo.toml

      - name: Install Protoc
        uses: arduino/setup-protoc@v1

      - name: Build UI (WASM)
        run: |
          export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          cd ${UI_DIR}
          dx bundle --web --release
          cp -f ./public/assets/bootstrap.js ./target/dx/${APP_NAME}/release/web/public/assets/bootstrap.js
          python3 build.py ./target/dx/${APP_NAME}/release/web/public/index.html

      - name: Copy UI bundle into server wwwroot
        run: |
          mkdir -p ${SERVER_DIR}/wwwroot
          rm -rf ${SERVER_DIR}/wwwroot/* ${SERVER_DIR}/wwwroot/.[!.]* 2>/dev/null || true
          cp -r ${UI_DIR}/target/dx/${APP_NAME}/release/web/public/* ${SERVER_DIR}/wwwroot/

      - name: Build server (release)
        run: |
          export GIT_HUB_TOKEN="${{ secrets.PUBLISH_TOKEN }}"
          cd ${SERVER_DIR}
          cargo build --release

      - name: Docker login
        run: |
          echo "${{ secrets.PUBLISH_TOKEN }}" | docker login https://ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker Build and Publish
        run: |
          cd ${SERVER_DIR}
          docker build -t ${IMAGE_NAME}:${{ steps.get_version.outputs.VERSION }} .
          docker push ${IMAGE_NAME}:${{ steps.get_version.outputs.VERSION }}
