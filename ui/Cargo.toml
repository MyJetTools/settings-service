[package]
name = "my-settings-ui"
version = "0.1.0"
edition = "2021"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }

dioxus-utils = { git = "https://github.com/MyJetTools/dioxus-utils.git", tag = "0.7.0", features = [
    "web",
] }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "base64",
] }

settings-utils = { tag = "0.1.2", git = "https://github.com/MyJetTools/settings-utils.git" }

reqwest = { version = "*", features = ["json", "multipart"] }
web-sys = { version = "*", features = ["Window", "Location", "Storage"] }
dioxus-logger = "*"

serde = { version = "*", features = ["derive"] }
serde_json = "*"
chrono = "*"
base64 = "*"

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
